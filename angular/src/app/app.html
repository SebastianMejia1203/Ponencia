<div class="content-main flex flex-col">
  <app-menubar />
  <!-- Barra superior simplificada -->
  <div class="title-bar flex items-center justify-between px-4 shadow-sm">
    <h1 class="text-lg font-medium">{{ title() }}</h1>
    <div class="flex items-center gap-2 text-sm">
      <span>Proyecto:</span>
      <span class="font-semibold">{{ projectName() }}</span>
      <div class="flex items-center gap-2">
        <div class="w-2 h-2 rounded-full" [class]="connectionStatusClass()"></div>
        <span>{{ connectionStatus() }}</span>
      </div>
    </div>
  </div>

  <!-- Tabs con Spartan UI -->
  <div class="tabs flex flex-col flex-1 overflow-hidden">
    <hlm-tabs tab="anotacion" class="w-full h-full flex flex-col">
      <hlm-tabs-list class="grid w-full grid-cols-4 flex-shrink-0" aria-label="tabs principales">
        <button hlmTabsTrigger="anotacion">Anotación</button>
        <button hlmTabsTrigger="entrenamiento">Entrenamiento</button>
        <button hlmTabsTrigger="prediccion">Predicción</button>
        <button hlmTabsTrigger="resultado">Resultado</button>
      </hlm-tabs-list>
      <div hlmTabsContent="anotacion" class="flex-1 overflow-auto text-sm bg-secondary/40">
        <app-anotacion />
      </div>
      <div hlmTabsContent="entrenamiento" class="flex-1 overflow-autotext-sm bg-secondary/40">
        <app-entrenamiento />
      </div>
      <div hlmTabsContent="prediccion" class="flex-1 overflow-auto text-sm bg-secondary/40">
        <app-prediccion />
      </div>
      <div hlmTabsContent="resultado" class="flex-1 overflow-auto text-sm bg-secondary/40">
        <app-resultado />
      </div>
    </hlm-tabs>
  </div>

</div>

<!-- Diálogo Nuevo Proyecto (siempre presente, se abre por acción de menú) -->
<app-create-project-dialog (createProject)="handleCreateProject($event)"></app-create-project-dialog>

<!-- Overlay progreso carga imágenes -->
<div class="images-loading-overlay" *ngIf="imagesLoading()">
  <div class="images-loading-box">
    <h3 class="text-sm font-semibold mb-3 flex items-center gap-2">
      <span class="w-2 h-2 rounded-full bg-indigo-500 animate-pulse"></span>
      Copiando imágenes ({{imagesCopied()}} / {{imagesTotal()}})
    </h3>
    <div class="progress-bar-track mb-2">
      <div class="progress-bar-fill" [style.width.%]="imagesProgressPct()"></div>
    </div>
    <div class="text-xs text-gray-500 flex justify-between">
      <span>{{imagesProgressPct() | number:'1.0-0'}}%</span>
      <span *ngIf="imagesElapsed() > 0">{{imagesElapsed() | number:'1.1-1'}}s</span>
    </div>
  </div>
</div>
