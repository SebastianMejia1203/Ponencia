<nav class="w-full select-none text-sm bg-white border-b flex items-stretch h-8 px-2 font-medium">
	<!-- Archivo -->
	<button brnMenuTrigger hlmBtn variant="ghost" size="sm" [brnMenuTriggerFor]="archivo" class="px-2 rounded-none">Archivo</button>
	<ng-template #archivo>
		<hlm-menu class="w-56">
			<button hlmMenuItem (click)="dispatch('nuevo-proyecto')"><span>Nuevo Proyecto</span><hlm-menu-shortcut>Ctrl+N</hlm-menu-shortcut></button>
			<button hlmMenuItem (click)="dispatch('abrir-proyecto')"><span>Abrir Proyecto</span><hlm-menu-shortcut>Ctrl+O</hlm-menu-shortcut></button>
			<button hlmMenuItem [brnMenuTriggerFor]="abrirReciente"><span>Abrir Reciente</span><hlm-menu-item-sub-indicator /></button>
			<!-- <hlm-menu-separator />
			<button hlmMenuItem [brnMenuTriggerFor]="importarSub"><span>Importar</span><hlm-menu-item-sub-indicator /></button>
			<button hlmMenuItem [brnMenuTriggerFor]="exportarSub"><span>Exportar</span><hlm-menu-item-sub-indicator /></button> -->
			<hlm-menu-separator />
			<button hlmMenuItem (click)="dispatch('salir')">Salir <hlm-menu-shortcut>Ctrl+Q</hlm-menu-shortcut></button>
		</hlm-menu>
	</ng-template>
	<ng-template #abrirReciente>
		<hlm-sub-menu class="w-64">
			<hlm-menu-label>Recientes</hlm-menu-label>
			@if (recentProjects().length > 0) {
				@for (r of recentProjects(); track r.configPath; let i = $index) {
					<button hlmMenuItem (click)="openRecent(r)">
						<span class="truncate max-w-48" title="{{r.configPath}}">{{i + 1}}. {{r.name}}</span>
					</button>
				}
				<hlm-menu-separator />
				<button hlmMenuItem (click)="clearRecents()">Limpiar Lista</button>
			} @else {
				<button hlmMenuItem disabled>No hay proyectos recientes</button>
				<hlm-menu-separator />
				<button hlmMenuItem disabled>Limpiar Lista</button>
			}
		</hlm-sub-menu>
	</ng-template>
	<ng-template #importarSub>
		<hlm-sub-menu class="w-48">
			<button hlmMenuItem (click)="dispatch('importar-dataset')">Dataset</button>
			<button hlmMenuItem (click)="dispatch('importar-modelo')">Modelo Preentrenado</button>
			<button hlmMenuItem (click)="dispatch('importar-config')">Configuración</button>
		</hlm-sub-menu>
	</ng-template>
	<ng-template #exportarSub>
		<hlm-sub-menu class="w-56">
			<button hlmMenuItem (click)="dispatch('exportar-proyecto')">Proyecto</button>
			<button hlmMenuItem (click)="dispatch('exportar-resultados')">Resultados</button>
			<button hlmMenuItem (click)="dispatch('exportar-pdf')">Reporte PDF</button>
		</hlm-sub-menu>
	</ng-template>

	<!-- Proyecto -->
	<button brnMenuTrigger hlmBtn variant="ghost" size="sm" [brnMenuTriggerFor]="proyecto" class="px-2 rounded-none">Proyecto</button>
	<ng-template #proyecto>
		<hlm-menu class="w-56">
			<button hlmMenuItem (click)="dispatch('guardar-proyecto')" [disabled]="!hasProject()">Guardar Proyecto <hlm-menu-shortcut>Ctrl+S</hlm-menu-shortcut></button>
			<button hlmMenuItem (click)="dispatch('cerrar-proyecto')" [disabled]="!hasProject()">Cerrar Proyecto <hlm-menu-shortcut>Ctrl+W</hlm-menu-shortcut></button>
			<hlm-menu-separator />
			<button hlmMenuItem (click)="dispatch('cargar-imagenes')" [disabled]="!hasProject()">Cargar Imágenes <hlm-menu-shortcut>Ctrl+I</hlm-menu-shortcut></button>
			<button hlmMenuItem (click)="dispatch('gestionar-imagenes')" [disabled]="!hasProject()">Gestionar Imágenes</button>
			<button hlmMenuItem (click)="dispatch('gestionar-clases')" [disabled]="!hasProject()">Gestionar Clases <hlm-menu-shortcut>Ctrl+G</hlm-menu-shortcut></button>
			<!-- <hlm-menu-separator />
			<button hlmMenuItem (click)="dispatch('exportar-yolo')">Exportar a YOLO <hlm-menu-shortcut>Ctrl+E</hlm-menu-shortcut></button> -->
		</hlm-menu>
	</ng-template>

		<ng-template #ayuda>
